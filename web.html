<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Advanced Form Validation</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family: Arial, sans-serif;
  background:#0b0f19;
  color:white;
}
.container{
  max-width:400px;
  margin:60px auto;
  background:#111827;
  padding:25px;
  border-radius:10px;
}
h2{text-align:center;}
input,select,button{
  width:100%;
  padding:10px;
  margin-top:10px;
  border-radius:6px;
  border:none;
}
input:focus,select:focus{
  outline:none;
  box-shadow:0 0 6px #58a6ff;
}
.error{
  color:#ff6b6b;
  font-size:0.85rem;
}
.success{
  color:#4ade80;
  text-align:center;
  margin-top:15px;
}
button{
  background:#58a6ff;
  cursor:pointer;
}
.row{
  display:flex;
  gap:10px;
}
</style>
</head>

<body>

<div class="container">
<h2>Payment Details</h2>

<form id="paymentForm">

<input type="text" id="name" placeholder="Card Holder Name">
<div class="error" id="nameErr"></div>

<input type="text" id="card" placeholder="Credit Card Number" maxlength="16">
<div class="error" id="cardErr"></div>

<div class="row">
  <input type="text" id="cvv" placeholder="CVV" maxlength="3">
  <select id="month"></select>
  <select id="year"></select>
</div>
<div class="error" id="cvvErr"></div>
<div class="error" id="dateErr"></div>

<button type="submit">Pay Now</button>
<div class="success" id="successMsg"></div>

</form>
</div>

<script>
/* ===== Generate Month & Year Dropdowns ===== */
const monthSelect = document.getElementById("month");
const yearSelect = document.getElementById("year");

monthSelect.innerHTML = `<option value="">Month</option>`;
for(let m=1;m<=12;m++){
  monthSelect.innerHTML += `<option value="${m}">${m}</option>`;
}

yearSelect.innerHTML = `<option value="">Year</option>`;
const currentYear = new Date().getFullYear();
for(let y=currentYear;y<=currentYear+10;y++){
  yearSelect.innerHTML += `<option value="${y}">${y}</option>`;
}

/* ===== Auto Focus Movement ===== */
document.getElementById("card").addEventListener("input",function(){
  if(this.value.length === 16){
    document.getElementById("cvv").focus();
  }
});
document.getElementById("cvv").addEventListener("input",function(){
  if(this.value.length === 3){
    monthSelect.focus();
  }
});

/* ===== Validation ===== */
document.getElementById("paymentForm").addEventListener("submit",function(e){
  e.preventDefault();

  let valid=true;
  document.querySelectorAll(".error").forEach(e=>e.innerText="");
  document.getElementById("successMsg").innerText="";

  const name=document.getElementById("name").value.trim();
  const card=document.getElementById("card").value.trim();
  const cvv=document.getElementById("cvv").value.trim();
  const month=monthSelect.value;
  const year=yearSelect.value;

  /* Name Validation */
  if(!/^[A-Za-z ]+$/.test(name)){
    document.getElementById("nameErr").innerText=
      "Name must contain only alphabets";
    valid=false;
  }

  /* Card Validation (Starts with 4 or 5, length 16) */
  if(!/^(4|5)\d{15}$/.test(card)){
    document.getElementById("cardErr").innerText=
      "Invalid credit card number";
    valid=false;
  }

  /* CVV Validation */
  if(!/^\d{3}$/.test(cvv)){
    document.getElementById("cvvErr").innerText=
      "CVV must be 3 digits";
    valid=false;
  }

  /* Expiry Date Validation */
  if(month==="" || year===""){
    document.getElementById("dateErr").innerText=
      "Select valid expiry month and year";
    valid=false;
  }else{
    const expiry=new Date(year,month-1);
    const today=new Date();
    if(expiry <= today){
      document.getElementById("dateErr").innerText=
        "Card expiry must be a future date";
      valid=false;
    }
  }

  if(valid){
    document.getElementById("successMsg").innerText=
      "Payment Successful";
  }
});
</script>

</body>
</html>
